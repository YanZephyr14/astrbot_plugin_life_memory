name: "astrbot_plugin_life_memory"
display_name: "拟真生活 (Life Memory)"
short_desc: "为 AI 角色提供拟真的生活记忆层，支持每日起居规划、进行中大事与小事动态注入。"
desc: |
  为 AI 角色提供仿真的生活记忆层：
  - 🌅 **每日生活起居规划**：每天第一次上线规划今日行程与心境，支持时段、节日、穿搭与天气感知；
  - 🔄 **事件双轨生命周期**：当天小事记一天（隔天自动淡忘），进行中大事长兜底跨天保留；
  - ⚡ **动态提示词注入**：单轮临时注入（不污染系统提示词与服务端 Prompt 缓存），聊到相关话题自然接茬；
  - 🎭 **多角色独立隔离**：多 Persona 角色生活线完全独立，支持白名单控制；
  - 📊 **可视化 WebUI 看板**：内置全功能 Dashboard，在线一键生成起居规划与管理生活事件。
version: "1.4.0"
